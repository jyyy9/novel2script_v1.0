metadata:
  author: 未知作者
  total_scenes: 4
scenes:
- heading: 日内 书房
  description: 窗外雨声淅沥，林晚棠坐在窗前，手中的茶杯已经凉了。思绪飘回十年前的夜晚。
  elements:
  - type: action
    description: 丫鬟小翠轻轻推门进来，手中端着一个食盒。
    element_id: A001
  - type: dialogue
    character: 小翠
    line: 小姐，该用晚膳了。
    parenthetical: ''
    element_id: D002
  - type: dialogue
    character: 林晚棠
    line: 放下吧，我还不饿。
    parenthetical: ''
    element_id: D003
  - type: action
    description: 小翠把食盒放在桌上，忍不住说道。
    element_id: A004
  - type: dialogue
    character: 小翠
    line: 小姐，您从傍晚就坐在这里发呆，茶都凉了两壶了。老爷要是知道……
    parenthetical: ''
    element_id: D005
  - type: dialogue
    character: 林晚棠
    line: 老爷若是问起，就说我身子不适。
    parenthetical: ''
    element_id: D006
  - type: action
    description: 小翠欲言又止，最终只是叹了口气，悄悄退了出去。
    element_id: A007
  - type: action
    description: 房门关上，林晚棠的目光再次落在窗外。梧桐叶在雨中沙沙作响，像是有人在低声诉说着什么。
    element_id: A008
  - type: action
    description: 林晚棠轻声呢喃，手中无意识地握紧了一枚玉佩。
    element_id: A009
  - type: action
    description: 那枚玉佩通体莹白，雕刻着一朵兰花，是十年前那个人临别时留给她的信物。
    element_id: A010
  - type: dialogue
    character: 林晚棠
    line: 等我回来。
    parenthetical: ''
    element_id: D011
  - type: action
    description: 可这一等，就是十年。
    element_id: A012
  scene_id: S001
- heading: 日内 城门
  description: 城门人来人往，阳光透过城门洒在地面上，城匾斑驳，映衬着风尘仆仆的男子。
  elements:
  - type: action
    description: 一个风尘仆仆的男子站在城门前，望着那块斑驳的城匾，神情复杂。
    element_id: A001
  - type: dialogue
    character: 顾言卿
    line: 澜州，我终于回来了。
    parenthetical: ''
    element_id: D002
  - type: action
    description: 顾言卿握紧腰间的长剑，深吸一口气，准备迈入城中。
    element_id: A003
  scene_id: S002
- heading: 日内 城市街道
  description: 城市街道熙熙攘攘，人群来往，顾言卿融入人流之中，心中只有一个名字在回荡。
  elements:
  - type: action
    description: 顾言卿整了整衣衫，迈步走入城中。无论如何，他都要再见她一面。
    element_id: A001
  - type: dialogue
    character: 顾言卿
    line: 晚棠……你还好吗？
    parenthetical: （眼神柔和）
    element_id: D002
  scene_id: S003
- heading: 侯府后花园
  description: 林晚棠独自赏花，小翠匆匆跑来告知顾言卿回来的消息。
  elements:
  - type: action
    description: 林晚棠手中的花枝微微一颤，表现出内心的震动。
    element_id: A001
  - type: dialogue
    character: 小翠
    line: 小姐，顾家少爷回来了！听说他十年前去了边关，前几日刚回来。
    parenthetical: （兴奋）
    element_id: D002
  - type: action
    description: 林晚棠沉默片刻，表现出内心的犹豫和思考。
    element_id: A003
  - type: dialogue
    character: 小翠
    line: 要不您去顾府拜访一下？两家毕竟是世交……
    parenthetical: （眨眨眼，调皮）
    element_id: D004
  - type: dialogue
    character: 顾言卿
    line: 不必了，我已经来了。
    parenthetical: ''
    element_id: D005
  - type: action
    description: 林晚棠猛然转身，看见顾言卿站在不远处微笑，内心充满复杂的情绪。
    element_id: A006
  - type: dialogue
    character: 顾言卿
    line: 晚棠，我回来了。
    parenthetical: ''
    element_id: D007
  scene_id: S004
