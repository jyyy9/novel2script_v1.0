metadata:
  author: 未知作者
  total_scenes: 6
scenes:
- heading: 日内 江城老居民楼外
  description: 雨夜，林晚棠站在巷口，昏黄的路灯下，老人突然出现。
  elements:
  - type: action
    description: 天空像撕开了一道口子，雨水倾盆而下。林晚棠提着半湿的行李箱站在巷口，昏黄的路灯下，等待着前往402室的新居。
    element_id: A001
  - type: dialogue
    character: 老人
    line: 姑娘，找人啊？
    parenthetical: （声音苍老，眼神亮净）
    element_id: D002
  - type: dialogue
    character: 林晚棠
    line: 我租了这里的房子，402。
    parenthetical: （试图展现勇气）
    element_id: D003
  - type: action
    description: 老人深深看了林晚棠一眼，然后缓缓缩回窗户，留下一丝神秘的气息。
    element_id: A004
  scene_id: S001
- heading: 日内 402室
  description: 林晚棠进入新居，房间陈旧而潮湿，一系列诡异事件开始发生。
  elements:
  - type: action
    description: 林晚棠打开门，进入402室，感受到房间的潮湿和霉味。
    element_id: A001
  - type: action
    description: 她尝试打开窗帘，却被房门自行关上，随后又自行打开。
    element_id: A002
  - type: dialogue
    character: 林晚棠
    line: 没事的，老房子，风。
    parenthetical: （试图安抚自己的恐惧）
    element_id: D003
  - type: action
    description: 林晚棠进入卫生间洗漱，发现水龙头的水是铁锈色的。
    element_id: A004
  - type: dialogue
    character: 小女孩（幽灵）
    line: 姐姐，你看见我的眼睛了吗？
    parenthetical: （声音细细，诡异）
    element_id: D005
  - type: action
    description: 林晚棠惊恐地面对着卫生间门外的模糊影子，听到指甲刮玻璃的声音。
    element_id: A006
  scene_id: S002
- heading: 日内 402室
  description: 林晚棠回到自己的公寓，开始整理和改造房间。
  elements:
  - type: action
    description: 林晚棠检查原来的锁，换上新锁，打扫卫生，更换窗帘，营造舒适的氛围。
    element_id: A001
  - type: action
    description: 林晚棠洗澡换衣，坐在床上追剧，感到孤单但并不害怕。
    element_id: A002
  - type: dialogue
    character: 林晚棠
    line: 一切都会好的。
    parenthetical: (自言自语)
    element_id: D003
  scene_id: S003
- heading: 夜内 402室
  description: 半夜，林晚棠被一阵凉意惊醒，发现卫生间的灯亮着，镜子里映出诡异的景象。
  elements:
  - type: action
    description: 林晚棠看到卫生间镜子里的异象，无法动弹，目睹小女孩的诡异行为。
    element_id: A001
  - type: dialogue
    character: 小女孩
    line: 藏起来了，他们把我的眼睛藏起来了。姐姐，你能帮我找找吗？
    parenthetical: (模糊而恳求)
    element_id: D002
  - type: dialogue
    character: 小女孩
    line: 你在看我，对不对？
    parenthetical: (咧嘴笑)
    element_id: D003
  scene_id: S004
- heading: 日内 402室
  description: 林晚棠在房间内重新审视周围环境，发现了地板下的暗格。
  elements:
  - type: action
    description: 林晚棠趴在地板上，用手指敲击木地板，发现床头柜下面的地板声音不同。她用刀尖撬开地板，露出一个浅浅的暗格。
    element_id: A001
  - type: action
    description: 林晚棠从暗格中拿出一本粉色的日记本，上面画着卡通小猫。她开始阅读日记内容。
    element_id: A002
  - type: dialogue
    character: 小女孩（幽灵）
    line: 今天妈妈又哭了。爸爸说要把我送去奶奶家。我不想走。我把玻璃珠藏在了一个谁也找不到的地方。
    parenthetical: ''
    element_id: D003
  - type: dialogue
    character: 小女孩（幽灵）
    line: 他们把我的眼睛藏起来了。我好疼。姐姐说她会帮我找，可是她后来也走了。
    parenthetical: ''
    element_id: D004
  scene_id: S005
- heading: 日内 卫生间
  description: 林晚棠在卫生间找到了两颗玻璃弹珠，解开了谜团。
  elements:
  - type: action
    description: 林晚棠冲进卫生间，撬开松动的地砖，发现两颗玻璃弹珠躺在下面。一颗蓝，一颗绿。
    element_id: A001
  - type: dialogue
    character: 小女孩（幽灵）
    line: 找到了。
    parenthetical: ''
    element_id: D002
  - type: action
    description: 林晚棠转身，把玻璃弹珠还给了小女孩的幽灵。
    element_id: A003
  - type: dialogue
    character: 林晚棠
    line: 还给你。你妈妈给你的，一直都在这里。
    parenthetical: 哽咽
    element_id: D004
  scene_id: S006
